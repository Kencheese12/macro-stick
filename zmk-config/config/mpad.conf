# File: config/mpad.conf

# ---- エンコーダ ----
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ---- スクロール（マウス機能） ----
CONFIG_ZMK_POINTING=y

# ---- 省電力 ----
# 30分操作がなければディープスリープ。キーかエンコーダ押下で復帰（回転では復帰しない）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ---- 電池残量通知（Windows 11 の Bluetooth 設定に表示） ----
CONFIG_ZMK_BATTERY_REPORTING=y

# ---- 送信出力（既定 0dBm のまま。下の注意を読んでから変更） ----
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y